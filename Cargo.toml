[package]
name = "veylo"
version = "0.1.0"
edition = "2021"
authors = ["Abneesh Singh"]
description = "Veylo - Ultra-accurate, lightweight, 100% free offline voice intelligence in Rust"

[dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Controls",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
] }

cpal = "0.15"
rodio = { version = "0.19", default-features = false, features = ["wav"] }
crossbeam-channel = "0.5"
parking_lot = "0.12"

[build-dependencies]
winres = "0.1"
